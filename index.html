<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de persecuciones y encuentros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0a22; color: #ece8ff; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input[type="range"] { accent-color: #35e0d1; }
        input[type="range"]::-webkit-slider-thumb { cursor: pointer; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #14102e; }
        ::-webkit-scrollbar-thumb { background: #2e2764; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #453c8a; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="flex flex-col lg:flex-row gap-6 max-w-[1500px] w-full items-start justify-center">
        
        <!-- Canvas principal -->
        <div class="relative flex flex-col items-center">
            <canvas id="simCanvas" width="880" height="650" class="rounded-xl shadow-2xl bg-[#0d0a22] border border-[#2e2764] select-none"></canvas>
            <div id="retoInputsContainer" class="absolute hidden flex gap-3 items-center" style="top: 502px; left: 50px;">
                <!-- Inputs injected dynamically for challenge mode -->
            </div>
        </div>

        <!-- Panel de control lateral -->
        <div class="bg-[#14102e] border border-[#2e2764] rounded-xl p-5 w-full lg:w-[460px] flex flex-col gap-4 shadow-2xl max-h-[650px] overflow-y-auto">
            <div>
                <h1 class="text-xl font-bold text-[#ece8ff]">Persecuciones y encuentros</h1>
                <p class="text-xs text-[#9188c4]">Dos vehículos, una ecuación (Cinemática 1D)</p>
            </div>

            <!-- Escenarios -->
            <div class="grid grid-cols-2 gap-2" id="scenariosGrid">
                <!-- Dynamically populated scenario buttons -->
            </div>

            <!-- Botón Reto -->
            <button id="btnReto" class="w-full py-2 px-4 rounded-lg font-bold text-sm border border-[#ff4f8b] text-[#ff4f8b] hover:bg-[#ff4f8b]/10 transition-colors flex items-center justify-center gap-2">
                <span>Nuevo reto: ¿cuándo y dónde?</span>
            </button>

            <!-- Vehículos Config -->
            <div id="vehicleConfigsContainer" class="flex flex-col gap-3">
                <!-- Vehicle A & B cards generated via JS -->
            </div>

            <!-- Velocidad de reproducción -->
            <div class="bg-[#181339] border border-[#2e2764] rounded-lg p-3">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs text-[#9188c4]">Velocidad de reproducción</span>
                    <span id="lblVel" class="font-mono text-xs text-[#ece8ff]">1.00×</span>
                </div>
                <input type="range" id="sliderVel" min="0.25" max="3" step="0.25" value="1.0" class="w-full">
            </div>

            <!-- Controles Play / Reiniciar -->
            <div class="flex gap-3">
                <button id="btnPlay" class="flex-1 py-2.5 px-4 rounded-lg font-bold text-sm bg-[#5be3a0] text-[#0d0a22] hover:bg-[#43c88a] transition-colors flex items-center justify-center gap-2 shadow-lg">
                    ▶ Reproducir
                </button>
                <button id="btnReset" class="flex-1 py-2.5 px-4 rounded-lg font-bold text-sm bg-[#231c52] border border-[#2e2764] text-[#ece8ff] hover:bg-[#2e2764] transition-colors flex items-center justify-center gap-2">
                    ↺ Reiniciar
                </button>
            </div>
            
            <div class="text-[10px] text-[#6d649f] text-center mt-1">
                Espacio = reproducir/pausar · R = reiniciar · ← → = 0.25s · Arrastra vehículos o gráfica
            </div>
        </div>

    </div>

    <script>
        // ───────────────────────── Constantes y Geometría ─────────────────────────
        const ANCHO = 880, ALTO = 650;
        const ESC_H = 300; // alto de la escena (cielo + carretera + regla)
        const HORIZONTE = 196;
        const RUTA_TOP = 196, RUTA_BOT = 282;
        const LANE = { 0: [276, 1.0], 1: [232, 0.88] }; // (y del suelo, escala): A cerca, B lejos
        const CHIP_Y = { 0: 134, 1: 94 };
        const GR = [12, 312, 572, 638]; // tarjeta de la gráfica
        const GX0 = 70, GX1 = 556, GY0 = 358, GY1 = 598;
        const SR = [584, 312, 868, 638]; // tarjeta de la solución
        const EPS = 1e-9;

        const C = {
            fondo: "#0d0a22", panel: "#14102e", tarjeta: "#181339", borde: "#2e2764",
            chip: "#231c52", chip_bg: "#1a1442", entrada: "#241d56",
            texto: "#ece8ff", tenue: "#9188c4", tenue2: "#6d649f",
            malla: "#262050", eje: "#6f66a8",
            A: "#35e0d1", B: "#ffc247", ev: "#ff4f8b",
            ok: "#5be3a0", alcance: "#ff6fa5", doble: "#b69cff", no: "#9a92c8",
            asfalto: "#17132e", acera: "#51468a", regla: "#0e0b22", raya: "#cfc7f0",
            cielo0: "#0f0a2e", cielo1: "#35196a", cielo2: "#9a3b86", cielo3: "#ff7a5c",
            colina: "#4a1f5e", ciudad: "#1d1140", ventana: "#ffd98a"
        };

        // ───────────────────────── Utilidades ─────────────────────────
        function mezclar(c1, c2, t) {
            t = Math.max(0.0, Math.min(1.0, t));
            const a = [parseInt(c1.slice(1,3),16), parseInt(c1.slice(3,5),16), parseInt(c1.slice(5,7),16)];
            const b = [parseInt(c2.slice(1,3),16), parseInt(c2.slice(3,5),16), parseInt(c2.slice(5,7),16)];
            const res = a.map((ai, i) => Math.round(ai + (b[i] - ai) * t));
            return "#" + res.map(v => v.toString(16).padStart(2, '0')).join('');
        }

        function rectRedondo(ctx, x1, y1, x2, y2, r, fillStyle, strokeStyle, lineWidth = 1) {
            ctx.beginPath();
            ctx.moveTo(x1 + r, y1);
            ctx.lineTo(x2 - r, y1);
            ctx.quadraticCurveTo(x2, y1, x2, y1 + r);
            ctx.lineTo(x2, y2 - r);
            ctx.quadraticCurveTo(x2, y2, x2 - r, y2);
            ctx.lineTo(x1 + r, y2);
            ctx.quadraticCurveTo(x1, y2, x1, y2 - r);
            ctx.lineTo(x1, y1 + r);
            ctx.quadraticCurveTo(x1, y1, x1 + r, y1);
            ctx.closePath();
            if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
            if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = lineWidth; ctx.stroke(); }
        }

        function pasoBonito(span, n) {
            if (span <= 0) return 1.0;
            let crudo = span / n;
            let mag = Math.pow(10, Math.floor(Math.log10(crudo)));
            for (let k of [1, 2, 2.5, 5, 10]) {
                if (crudo <= k * mag + 1e-12) return k * mag;
            }
            return 10 * mag;
        }

        function marcas(lo, hi, n = 6) {
            let paso = pasoBonito(hi - lo, n);
            let k = Math.ceil(lo / paso - 1e-9);
            let out = [];
            while (k * paso <= hi + 1e-9 && out.length < 200) {
                out.push(Math.round(k * paso * 1e9) / 1e9);
                k++;
            }
            return [paso, out];
        }

        function num(x, d = 1) {
            if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0.0;
            return x.toFixed(d).replace("-", "−");
        }

        function g(x) {
            return x.toString().replace("-", "−");
        }

        function poli(p) {
            let [x0, v0, a] = p;
            let s = g(x0);
            if (Math.abs(v0) > EPS) {
                s += ` ${v0 < 0 ? '−' : '+'} ${g(Math.abs(v0))}t`;
            }
            if (Math.abs(a) > EPS) {
                s += ` ${a < 0 ? '−' : '+'} ${g(Math.abs(a) / 2)}t²`;
            }
            return s;
        }

        function colorCielo(y) {
            let t = Math.max(0.0, Math.min(1.0, y / HORIZONTE));
            const paradas = [[0.0, C.cielo0], [0.5, C.cielo1], [0.82, C.cielo2], [1.0, C.cielo3]];
            for (let i = 0; i < paradas.length - 1; i++) {
                let [t0, c0] = paradas[i];
                let [t1, c1] = paradas[i+1];
                if (t <= t1) return mezclar(c0, c1, (t - t0) / (t1 - t0));
            }
            return paradas[paradas.length - 1][1];
        }

        // ───────────────────────── Física y Solver ─────────────────────────
        function pos(p, t) { return p[0] + p[1] * t + 0.5 * p[2] * t * t; }
        function vel(p, t) { return p[1] + p[2] * t; }

        function describir(e) {
            if (e.tipo === "alcance") return `${e.quien} alcanza a ${e.quien === 'A' ? 'B' : 'A'}`;
            return { frontal: "frente a frente", roce: "se rozan", inicio: "parten juntos", contacto: "se encuentran" }[e.tipo];
        }

        function resolver(pa, pb) {
            let A = 0.5 * (pa[2] - pb[2]);
            let B = pa[1] - pb[1];
            let C0 = pa[0] - pb[0];
            let D = null, raices = [], caso = "";
            if (Math.abs(A) < EPS) {
                if (Math.abs(B) < EPS) {
                    caso = Math.abs(C0) < EPS ? "juntos" : "paralelas";
                } else {
                    let t = -C0 / B;
                    if (t >= -EPS) { raices = [Math.max(t, 0.0)]; caso = "lineal"; }
                    else { caso = "pasado"; }
                }
            } else {
                D = B * B - 4 * A * C0;
                if (D < -EPS) {
                    caso = "sin_raiz";
                } else {
                    D = Math.max(D, 0.0);
                    let sq = Math.sqrt(D);
                    let rs = [(-B - sq) / (2 * A), (-B + sq) / (2 * A)].sort((x, y) => x - y);
                    if (rs[1] - rs[0] < 1e-9) rs = rs.slice(0, 1);
                    raices = rs.map(r => Math.max(r, 0.0)).filter(r => r >= -EPS);
                    // unique
                    raices = [...new Set(raices)];
                    caso = raices.length ? "cuadratica" : "pasado";
                }
            }

            let eventos = [];
            for (let r of raices) {
                let va = vel(pa, r), vb = vel(pb, r);
                let tipo, quien;
                if (r < EPS && Math.abs(C0) < EPS) { tipo = "inicio"; quien = null; }
                else if (va * vb < -EPS) { tipo = "frontal"; quien = null; }
                else {
                    let ref = Math.abs(va) > EPS ? va : vb;
                    if (Math.abs(ref) <= EPS) { tipo = "contacto"; quien = null; }
                    else {
                        let d = ref > 0 ? 1 : -1;
                        let rel = (va - vb) * d;
                        if (rel > EPS) { tipo = "alcance"; quien = "A"; }
                        else if (rel < -EPS) { tipo = "alcance"; quien = "B"; }
                        else { tipo = "roce"; quien = null; }
                    }
                }
                eventos.push({ t: r, x: pos(pa, r), va, vb, tipo, quien });
            }

            let cerca = null;
            if (!eventos.length && caso !== "juntos") {
                if (D !== null && D < 0) {
                    let tv = -B / (2 * A);
                    if (tv > 0) cerca = [Math.abs(D) / (4 * Math.abs(A)), tv];
                }
                if (!cerca) cerca = [Math.abs(C0), 0.0];
            }

            let T = 12.0;
            if (eventos.length) T = Math.min(40.0, Math.max(8.0, 1.6 * eventos[eventos.length - 1].t));
            else if (cerca && cerca[1] > 0) T = Math.min(40.0, Math.max(10.0, 2 * cerca[1]));

            let notas = [], titulo = "", detalle = "", tono = "ok";
            if (caso === "juntos") {
                titulo = "Viajan juntos"; detalle = "Misma posición, velocidad y aceleración"; tono = "ok";
                notas = ["A = 0, B = 0 y C = 0: las dos", "posiciones coinciden en todo instante."];
            } else if (!eventos.length) {
                tono = "no";
                if (caso === "paralelas") {
                    titulo = "No se encuentran"; detalle = `Misma velocidad: separados ${num(Math.abs(C0))} m siempre`;
                    notas = ["A = 0 y B = 0: la distancia", "entre ellos no cambia."];
                } else if (caso === "pasado") {
                    titulo = "No se encuentran"; detalle = "Se alejan: el cruce ya ocurrió (o nunca)";
                    notas = ["La raíz sale con t < 0: el", "encuentro quedó en el pasado."];
                } else {
                    titulo = "No se encuentran"; detalle = "La ecuación no tiene solución real";
                    notas = ["D < 0: no existe un t real en el", "que xA y xB coincidan."];
                }
            } else if (eventos.length === 1) {
                let e = eventos[0];
                let baseTit = { frontal: "Se encuentran frente a frente", alcance: describir(e), roce: "Se rozan sin cruzarse", inicio: "Parten del mismo punto", contacto: "Se encuentran" }[e.tipo];
                titulo = baseTit.charAt(0).toUpperCase() + baseTit.slice(1);
                detalle = `En t = ${num(e.t, 2)} s, x = ${num(e.x)} m`;
                tono = e.tipo === "alcance" ? "alcance" : "ok";
            } else {
                titulo = "Se encuentran dos veces";
                detalle = `1.º ${describir(eventos[0])}; 2.º ${describir(eventos[1])}`;
                tono = "doble";
            }

            return { A, B, C: C0, D, caso, eventos, cerca, T, titulo, detalle, tono, notas };
        }

        // ───────────────────────── Simulador Estado ─────────────────────────
        class Simulacion {
            constructor() {
                this.pa = null; this.pb = null; this.sol = null;
                this.T = 10.0; this.dk = 1.0; this.t = 0.0;
                this.estado = "listo"; // listo | corriendo | pausado | fin
            }
            configurar(pa, pb) {
                this.pa = pa; this.pb = pb;
                this.sol = resolver(pa, pb);
                this.T = this.sol.T;
                this.dk = this.T <= 8 ? 0.5 : (this.T <= 24 ? 1.0 : 2.0);
                this.reiniciar();
            }
            p(i) { return i === 0 ? this.pa : this.pb; }
            x(i, t = null) { return pos(this.p(i), t === null ? this.t : t); }
            v(i, t = null) { return vel(this.p(i), t === null ? this.t : t); }
            reiniciar() { this.t = 0.0; this.estado = "listo"; }
            reproducir() { if (this.estado === "fin") this.t = 0.0; this.estado = "corriendo"; }
            pausar() { if (this.estado === "corriendo") this.estado = "pausado"; }
            avanzar(dt) {
                if (this.estado !== "corriendo") return;
                this.t += dt;
                if (this.t >= this.T) { this.t = this.T; this.estado = "fin"; }
            }
            ir_a(t) {
                this.t = Math.max(0.0, Math.min(this.T, t));
                this.estado = this.t <= 0 ? "listo" : (this.t >= this.T ? "fin" : "pausado");
            }
        }

        const ESCENARIOS = [
            ["Frente a frente",    { A: [0, 20, 0],  B: [200, -30, 0] }],
            ["Alcance",            { A: [0, 25, 0],  B: [60, 10, 0] }],
            ["Misma velocidad",    { A: [0, 18, 0],  B: [70, 18, 0] }],
            ["Semáforo en verde",  { A: [0, 20, 0],  B: [40, 0, 4] }],
            ["Casi se encuentran", { A: [0, 10, 0],  B: [50, 0, 2] }],
            ["Aceleran de frente", { A: [0, 0, 2],   B: [128, 0, -2] }],
        ];

        function generarReto() {
            const tipos = ["frontal", "alcance", "acelerado", "acelerado"];
            for (let attempt = 0; attempt < 800; attempt++) {
                let tipo = tipos[Math.floor(Math.random() * tipos.length)];
                let te = Math.floor(Math.random() * 7) + 3; // 3 to 9
                let va = 0, vb = 0, aa = 0, ab = 0;
                if (tipo === "frontal") {
                    va = [10, 15, 20, 25][Math.floor(Math.random()*4)];
                    vb = -[10, 15, 20, 25][Math.floor(Math.random()*4)];
                } else if (tipo === "alcance") {
                    vb = [5, 10, 15][Math.floor(Math.random()*3)];
                    va = vb + [5, 10, 15][Math.floor(Math.random()*3)];
                } else {
                    va = [0, 5, 10, 15][Math.floor(Math.random()*4)];
                    vb = [-15, -10, -5, 0, 5][Math.floor(Math.random()*5)];
                    aa = [0, 1, 2, 3, 4, -2][Math.floor(Math.random()*6)];
                    ab = [0, -1, -2, -3, 1, 2][Math.floor(Math.random()*6)];
                    if (aa === 0 && ab === 0) continue;
                }
                if ((aa * te * te) % 2 !== 0 || (ab * te * te) % 2 !== 0) continue;
                let xb0 = Math.floor(Math.random() * 140) + 20;
                let xe = xb0 + vb * te + Math.floor(ab * te * te / 2);
                let xa0 = xe - (va * te + Math.floor(aa * te * te / 2));
                if (xa0 < -100 || xa0 > 300) continue;
                let pa = [xa0, va, aa], pb = [xb0, vb, ab];
                let sol = resolver(pa, pb);
                if (sol.eventos.length && Math.abs(sol.eventos[0].t - te) < 1e-6) {
                    return { A: pa, B: pb };
                }
            }
            return ESCENARIOS[1][1];
        }

        // Perfiles de vehículos
        const PERFILES = [
            { // coupé
                cuerpo: [[-46, -9], [-47, -19], [-40, -23], [-27, -25], [-19, -37], [-2, -41], [13, -40], [25, -28], [41, -24], [48, -17], [47, -9]],
                vidrio: [[-17, -35], [-3, -38.5], [11, -37.5], [21, -28], [-24, -28]],
                pilar: [[-1, -38], [-1, -28]], faro: [46, -20], cola: [-46, -18], ruedas: [-28, 29]
            },
            { // furgoneta
                cuerpo: [[-48, -9], [-49, -38], [-45, -43], [16, -43], [27, -32], [44, -27], [49, -20], [48, -9]],
                vidrio: [[14, -40], [18, -40.5], [26, -32], [14, -32]],
                pilar: [[-8, -41], [-8, -12]], faro: [47, -21], cola: [-48, -27], ruedas: [-30, 30]
            }
        ];

        // ───────────────────────── Aplicación Web ─────────────────────────
        class AppWeb {
            constructor() {
                this.m = new Simulacion();
                this.cam_c = 100.0; this.cam_s = 5.0; this.snap = true;
                this.arrastre = null; this.scrub = false;
                this.reto = null; this.escenario = 1;
                this._dir = [1, -1];
                this._t_prev = performance.now();

                this.canvas = document.getElementById("simCanvas");
                this.ctx = this.canvas.getContext("2d");

                this.initUI();
                this.bindEvents();
                this.aplicarEscenario(1, false);
                requestAnimationFrame(this.bucle.bind(this));
            }

            initUI() {
                // Escenarios
                const scGrid = document.getElementById("scenariosGrid");
                ESCENARIOS.forEach(([nombre], idx) => {
                    let b = document.createElement("button");
                    b.className = `py-2 px-3 rounded-lg text-xs font-semibold text-left transition-colors ${idx === this.escenario ? 'bg-[#2e2764] text-[#ece8ff]' : 'bg-[#231c52] text-[#9188c4] hover:text-[#ece8ff]'}`;
                    b.textContent = nombre;
                    b.onclick = () => this.aplicarEscenario(idx);
                    scGrid.appendChild(b);
                });

                document.getElementById("btnReto").onclick = () => this.nuevoReto();
                document.getElementById("btnPlay").onclick = () => this.alternar();
                document.getElementById("btnReset").onclick = () => this.reiniciar();

                // Vehículos configs A y B
                const vCont = document.getElementById("vehicleConfigsContainer");
                ["Vehículo A", "Vehículo B"].forEach((nombre, i) => {
                    let col = i === 0 ? C.A : C.B;
                    let card = document.createElement("div");
                    card.className = "bg-[#181339] border border-[#2e2764] rounded-xl p-3 flex flex-col gap-2.5";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span style="color: ${col};">●</span>
                                <span class="font-bold text-sm text-[#ece8ff]">${nombre}</span>
                            </div>
                            <div class="flex bg-[#262050] rounded p-0.5 text-xs">
                                <button id="modeUni_${i}" class="px-2 py-0.5 rounded transition-colors font-medium">Uniforme</button>
                                <button id="modeAcel_${i}" class="px-2 py-0.5 rounded transition-colors font-medium">Acelerado</button>
                            </div>
                        </div>
                        ${this.crearSliderHTML(`x0_${i}`, "Posición inicial", -100, 300, 1, "m")}
                        ${this.crearSliderHTML(`v0_${i}`, "Velocidad inicial", -40, 40, 0.5, "m/s")}
                        ${this.crearSliderHTML(`a_${i}`, "Aceleración", -8, 8, 0.5, "m/s²")}
                    `;
                    vCont.appendChild(card);
                });

                // Event listeners for UI inputs
                for (let i of [0, 1]) {
                    document.getElementById(`modeUni_${i}`).onclick = () => this.ponerModo(i, "uniforme");
                    document.getElementById(`modeAcel_${i}`).onclick = () => this.ponerModo(i, "acelerado");
                    
                    document.getElementById(`x0_${i}`).oninput = (e) => { this.v_x0(i, parseFloat(e.target.value)); };
                    document.getElementById(`v0_${i}`).oninput = (e) => { this.v_v0(i, parseFloat(e.target.value)); };
                    document.getElementById(`a_${i}`).oninput = (e) => { this.v_a(i, parseFloat(e.target.value)); };
                }

                document.getElementById("sliderVel").oninput = (e) => {
                    document.getElementById("lblVel").textContent = parseFloat(e.target.value).toFixed(2) + "×";
                };

                // Canvas events
                this.canvas.onmousedown = this.alPresionar.bind(this);
                this.canvas.onmousemove = this.alArrastrar.bind(this);
                window.onmouseup = this.alSoltar.bind(this);
                this.canvas.onmousemove = this.alMover.bind(this);
            }

            crearSliderHTML(id, label, min, max, step, unidad) {
                return `
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span id="lblTitle_${id}" class="text-[#9188c4]">${label}</span>
                            <span id="lblVal_${id}" class="font-mono text-[#ece8ff]">0</span>
                        </div>
                        <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="0" class="w-full">
                    </div>
                `;
            }

            bindEvents() {
                window.onkeydown = (e) => {
                    if (document.activeElement.tagName === "INPUT") return;
                    if (e.code === "Space") { e.preventDefault(); this.alternar(); }
                    if (e.key === "r" || e.key === "R") { e.preventDefault(); this.reiniciar(); }
                    if (e.key === "ArrowLeft") { e.preventDefault(); this.pasoTiempo(-0.25); }
                    if (e.key === "ArrowRight") { e.preventDefault(); this.pasoTiempo(0.25); }
                };
            }

            // Getters/Setters helpers for UI values
            getUIParam(i) {
                let x0 = parseFloat(document.getElementById(`x0_${i}`).value);
                let v0 = parseFloat(document.getElementById(`v0_${i}`).value);
                let isAcel = document.getElementById(`modeAcel_${i}`).classList.contains("bg-teal-400") || 
                              document.getElementById(`modeAcel_${i}`).style.backgroundColor !== "";
                let a = isAcel ? parseFloat(document.getElementById(`a_${i}`).value) : 0.0;
                return [x0, v0, a];
            }

            setUIParam(i, p) {
                document.getElementById(`x0_${i}`).value = p[0];
                document.getElementById(`lblVal_x0_${i}`).textContent = Math.round(p[0]) + " m";
                document.getElementById(`v0_${i}`).value = p[1];
                document.getElementById(`lblVal_v0_${i}`).textContent = (p[1] >= 0 ? "+" : "") + p[1].toFixed(1) + " m/s";
                
                let isAcel = Math.abs(p[2]) > EPS;
                document.getElementById(`a_${i}`).value = p[2];
                document.getElementById(`lblVal_a_${i}`).textContent = (p[2] >= 0 ? "+" : "") + p[2].toFixed(1) + " m/s²";
                
                this.ponerModo(i, isAcel ? "acelerado" : "uniforme", false);
            }

            v_x0(i, val) {
                document.getElementById(`lblVal_x0_${i}`).textContent = Math.round(val) + " m";
                this.sincronizarParams();
            }
            v_v0(i, val) {
                document.getElementById(`lblVal_v0_${i}`).textContent = (val >= 0 ? "+" : "") + val.toFixed(1) + " m/s";
                this.sincronizarParams();
            }
            v_a(i, val) {
                document.getElementById(`lblVal_a_${i}`).textContent = (val >= 0 ? "+" : "") + val.toFixed(1) + " m/s²";
                this.sincronizarParams();
            }

            ponerModo(i, clave, sync = true) {
                let col = i === 0 ? C.A : C.B;
                let bUni = document.getElementById(`modeUni_${i}`);
                let bAcel = document.getElementById(`modeAcel_${i}`);
                let sliderA = document.getElementById(`a_${i}`);
                let lblA = document.getElementById(`lblTitle_a_${i}`);
                let lblValA = document.getElementById(`lblVal_a_${i}`);

                if (clave === "uniforme") {
                    bUni.style.background = col; bUni.style.color = "#0d0a22";
                    bAcel.style.background = "transparent"; bAcel.style.color = C.tenue;
                    sliderA.disabled = true;
                    lblA.style.color = C.tenue2; lblValA.style.color = C.tenue2;
                    document.getElementById(`a_${i}`).value = 0;
                } else {
                    bAcel.style.background = col; bAcel.style.color = "#0d0a22";
                    bUni.style.background = "transparent"; bUni.style.color = C.tenue;
                    sliderA.disabled = false;
                    lblA.style.color = C.tenue; lblValA.style.color = C.texto;
                    if (parseFloat(sliderA.value) === 0) sliderA.value = 2.0;
                }
                if (sync) this.sincronizarParams();
            }

            sincronizarParams() {
                let pa = this.getUIParam(0);
                let pb = this.getUIParam(1);
                this.m.configurar(pa, pb);
                for (let i of [0, 1]) {
                    let s = pa[1]; // simplified direction check
                    if (s) this._dir[i] = s > 0 ? 1 : -1;
                }
                if (!this.arrastre) this.snap = true;
            }

            aplicarEscenario(idx, auto = true) {
                this.escenario = idx;
                this.reto = null;
                this.actualizarEscenariosUI();
                let d = ESCENARIOS[idx][1];
                this.setUIParam(0, d.A);
                this.setUIParam(1, d.B);
                this.sincronizarParams();
                document.getElementById("retoInputsContainer").classList.add("hidden");
                if (auto) setTimeout(() => { if (!this.reto && this.m.estado === "listo" && this.m.t === 0) this.m.reproducir(); }, 550);
            }

            actualizarEscenariosUI() {
                const scGrid = document.getElementById("scenariosGrid");
                Array.from(scGrid.children).forEach((b, idx) => {
                    if (idx === this.escenario) {
                        b.className = "py-2 px-3 rounded-lg text-xs font-semibold text-left transition-colors bg-[#2e2764] text-[#ece8ff]";
                    } else {
                        b.className = "py-2 px-3 rounded-lg text-xs font-semibold text-left transition-colors bg-[#231c52] text-[#9188c4] hover:text-[#ece8ff]";
                    }
                });
            }

            nuevoReto() {
                let d = generarReto();
                this.escenario = null;
                this.actualizarEscenariosUI();
                this.reto = { estado: "pregunta", msg: "", tono: "tenue" };
                this.setUIParam(0, d.A);
                this.setUIParam(1, d.B);
                this.sincronizarParams();
                this.construirRetoUI();
            }

            construirRetoUI() {
                let container = document.getElementById("retoInputsContainer");
                container.classList.remove("hidden");
                container.innerHTML = `
                    <div class="flex flex-col gap-2 bg-[#181339] border border-[#2e2764] p-4 rounded-xl shadow-xl w-[260px]">
                        <div class="text-xs font-bold text-[#ff4f8b]">Reto: Resuélvelo a mano</div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-[#9188c4]">t =</span>
                            <input type="text" id="inputRetoT" class="w-20 bg-[#241d56] border border-[#2e2764] rounded px-2 py-1 text-xs text-[#ece8ff] font-mono text-right" placeholder="s">
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-[#9188c4]">x =</span>
                            <input type="text" id="inputRetoX" class="w-20 bg-[#241d56] border border-[#2e2764] rounded px-2 py-1 text-xs text-[#ece8ff] font-mono text-right" placeholder="m">
                        </div>
                        <div class="flex gap-2 mt-1">
                            <button id="btnComprobarReto" class="flex-1 py-1 px-2 bg-[#ff4f8b] text-white font-bold text-xs rounded hover:bg-[#e03d78] transition-colors">Comprobar</button>
                            <button id="btnVerSolReto" class="flex-1 py-1 px-2 bg-[#262050] text-[#ece8ff] text-xs rounded hover:bg-[#2e2764] transition-colors">Solución</button>
                        </div>
                        <div id="retoMsg" class="text-[11px] text-[#9188c4] mt-1"></div>
                    </div>
                `;
                document.getElementById("btnComprobarReto").onclick = () => this.comprobarReto();
                document.getElementById("btnVerSolReto").onclick = () => { this.reto.state = "resuelto"; this.reto = null; };
            }

            comprobarReto() {
                let ev = this.m.sol.eventos;
                if (!ev.length) {
                    document.getElementById("retoMsg").textContent = "No hay encuentro. Pide un reto nuevo.";
                    return;
                }
                let tVal = parseFloat(document.getElementById("inputRetoT").value.replace(",", ".").replace("−", "-"));
                let xVal = parseFloat(document.getElementById("inputRetoX").value.replace(",", ".").replace("−", "-"));
                if (isNaN(tVal) || isNaN(xVal)) {
                    document.getElementById("retoMsg").textContent = "Escribe un número en cada casilla.";
                    return;
                }
                let e = ev[0];
                let okT = Math.abs(tVal - e.t) <= Math.max(0.05, 0.01 * e.t);
                let okX = Math.abs(xVal - e.x) <= Math.max(0.5, 0.01 * Math.abs(e.x));
                if (okT && okX) {
                    this.reto = null;
                    document.getElementById("retoInputsContainer").classList.add("hidden");
                    this.m.reiniciar(); this.snap = true; this.m.reproducir();
                } else {
                    document.getElementById("retoMsg").textContent = `t ${okT ? 'correcto' : 'incorrecto'}, x ${okX ? 'correcta' : 'incorrecta'}. ¡Inténtalo de nuevo!`;
                }
            }

            revela() { return this.reto === null; }

            alternar() {
                if (this.m.estado === "corriendo") this.m.pausar();
                else this.m.reproducir();
            }
            reiniciar() { this.m.reiniciar(); this.snap = true; }
            pasoTiempo(dt) { this.m.ir_a(this.m.t + dt); }

            // Coordenadas pantalla / mundo
            sx(x) { return ANCHO / 2 + (x - this.cam_c) * this.cam_s; }
            xw(px) { return this.cam_c + (px - ANCHO / 2) / this.cam_s; }

            alPresionar(ev) {
                let rect = this.canvas.getBoundingClientRect();
                let x = ev.clientX - rect.left, y = ev.clientY - rect.top;
                if (x >= GX0 - 12 && x <= GX1 + 12 && y >= GY0 - 26 && y <= GY1 + 34) {
                    this.scrub = true; this.scrubPos(x);
                } else if (y < ESC_H && this.m.estado === "listo") {
                    let veh = this.vehiculoEn(x, y);
                    if (veh !== null) {
                        this.arrastre = [veh, this.m.p(veh)[0] - this.xw(x)];
                    }
                }
            }

            alArrastrar(ev) {
                let rect = this.canvas.getBoundingClientRect();
                let x = ev.clientX - rect.left, y = ev.clientY - rect.top;
                if (this.scrub) {
                    this.scrubPos(x);
                } else if (this.arrastre) {
                    let [i, off] = this.arrastre;
                    let nuevoX = Math.round(Math.max(-100, Math.min(300, this.xw(x) + off)));
                    let p = this.getUIParam(i);
                    p[0] = nuevoX;
                    this.setUIParam(i, p);
                    this.sincronizarParams();
                }
            }

            alSoltar() { this.scrub = false; this.arrastre = null; }

            alMover(ev) {
                let rect = this.canvas.getBoundingClientRect();
                let x = ev.clientX - rect.left, y = ev.clientY - rect.top;
                if (this.scrub || this.arrastre) return;
                if (x >= GX0 - 12 && x <= GX1 + 12 && y >= GY0 - 26 && y <= GY1 + 34) {
                    this.canvas.style.cursor = "ew-resize";
                } else if (y < ESC_H && this.m.estado === "listo" && this.vehiculoEn(x, y) !== null) {
                    this.canvas.style.cursor = "pointer";
                } else {
                    this.canvas.style.cursor = "default";
                }
            }

            scrubPos(x) {
                let t = (x - GX0) / (GX1 - GX0) * this.m.T;
                this.m.ir_a(t);
            }

            vehiculoEn(x, y) {
                for (let i of [0, 1]) {
                    let [gy, esc] = LANE[i];
                    let cx = this.sx(this.m.x(i, 0.0));
                    if (Math.abs(x - cx) <= 52 * esc && gy - 46 * esc <= y && y <= gy + 6) return i;
                }
                return null;
            }

            // Bucle principal de animación y render
            bucle(timestamp) {
                let dt = Math.min((timestamp - this._t_prev) / 1000, 0.05);
                this._t_prev = timestamp;
                
                let velRep = parseFloat(document.getElementById("sliderVel").value);
                this.m.avanzar(dt * velRep);
                this.actualizarBotonPlay();
                this.actualizarCamara(dt);

                // Dibujar
                this.ctx.clearRect(0, 0, ANCHO, ALTO);
                this.dibujarFondo();
                this.dibujarEscena();
                this.dibujarGrafica();
                this.dibujarSolucion();

                requestAnimationFrame(this.bucle.bind(this));
            }

            actualizarBotonPlay() {
                let b = document.getElementById("btnPlay");
                if (this.m.estado === "corriendo") {
                    b.innerHTML = "❚❚ Pausar";
                    b.className = "flex-1 py-2.5 px-4 rounded-lg font-bold text-sm bg-[#ffc247] text-[#0d0a22] hover:bg-[#e8ac33] transition-colors flex items-center justify-center gap-2 shadow-lg";
                } else {
                    b.innerHTML = "▶ Reproducir";
                    b.className = "flex-1 py-2.5 px-4 rounded-lg font-bold text-sm bg-[#5be3a0] text-[#0d0a22] hover:bg-[#43c88a] transition-colors flex items-center justify-center gap-2 shadow-lg";
                }
            }

            actualizarCamara(dt) {
                let m = this.m;
                let xs = [m.x(0), m.x(1)];
                if (this.revela()) {
                    for (let e of m.sol.eventos) if (e.t >= m.t - 0.5) xs.push(e.x);
                }
                let lo = Math.min(...xs), hi = Math.max(...xs);
                let s_t = Math.max(0.35, Math.min(12.0, 640.0 / Math.max(hi - lo, 40.0)));
                let c_t = (lo + hi) / 2;
                if (this.snap) {
                    this.cam_c = c_t; this.cam_s = s_t; this.snap = false;
                } else if (!this.arrastre) {
                    let k = 1 - Math.exp(-5 * dt);
                    this.cam_c += (c_t - this.cam_c) * k;
                    this.cam_s = Math.exp(Math.log(this.cam_s) + (Math.log(s_t) - Math.log(this.cam_s)) * k);
                }
            }

            // ───────── Renderizado Escena ─────────
            dibujarFondo() {
                let ctx = this.ctx;
                ctx.fillStyle = C.fondo;
                ctx.fillRect(0, 0, ANCHO, ALTO);
                
                for (let y = 0; y < HORIZONTE; y += 4) {
                    ctx.fillStyle = colorCielo(y + 2);
                    ctx.fillRect(0, y, ANCHO, 4);
                }
                
                // Sol crepuscular
                let sx0 = 610, sy0 = HORIZONTE - 4;
                let base = colorCielo(sy0);
                for (let [r, a] of [[150, .05], [118, .08], [92, .13], [70, .20], [52, .32]]) {
                    ctx.fillStyle = mezclar(base, "#ff9a62", a);
                    ctx.beginPath(); ctx.arc(sx0, sy0, r, 0, 2 * Math.PI); ctx.fill();
                }
                ctx.fillStyle = "#ffd9a0";
                ctx.beginPath(); ctx.arc(sx0, sy0, 38, 0, 2 * Math.PI); ctx.fill();

                // Carretera
                ctx.fillStyle = C.asfalto; ctx.fillRect(0, RUTA_TOP, ANCHO, RUTA_BOT - RUTA_TOP);
                ctx.fillStyle = C.regla; ctx.fillRect(0, RUTA_BOT, ANCHO, ESC_H - RUTA_BOT);
                ctx.fillStyle = C.fondo; ctx.fillRect(0, ESC_H, ANCHO, ALTO - ESC_H);
                
                ctx.strokeStyle = C.acera; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, RUTA_TOP); ctx.lineTo(ANCHO, RUTA_TOP); ctx.stroke();
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, RUTA_BOT); ctx.lineTo(ANCHO, RUTA_BOT); ctx.stroke();
            }

            direccion(i, t) {
                let v = this.m.v(i, t);
                if (v > 0.05) this._dir[i] = 1;
                else if (v < -0.05) this._dir[i] = -1;
                return this._dir[i];
            }

            dibujarVehiculo(i, x, t, fantasma = null) {
                let ctx = this.ctx, m = this.m;
                let [gy, esc] = LANE[i];
                let cx = this.sx(x);
                if (cx < -100 || cx > ANCHO + 100) return;
                let pf = PERFILES[i];
                let col = i === 0 ? C.A : C.B;
                let d = this.direccion(i, t);
                let a = m.p(i)[2];
                let v = m.v(i, t);
                let phi = fantasma ? 0.0 : Math.max(-3.5, Math.min(3.5, -a * d * 0.9)) * Math.PI / 180;
                let cs = Math.cos(phi), sn = Math.sin(phi);

                function T(px, py, rot = true) {
                    if (rot && phi) {
                        let qx = px, qy = py + 9.0;
                        px = qx * cs - qy * sn; py = qx * sn + qy * cs - 9.0;
                    }
                    return [cx + d * px * esc, gy + py * esc];
                }

                if (fantasma) {
                    ctx.strokeStyle = fantasma; ctx.lineWidth = 1;
                    ctx.beginPath();
                    pf.cuerpo.forEach((pt, idx) => {
                        let [X, Y] = T(pt[0], pt[1]);
                        if (idx === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
                    });
                    ctx.closePath(); ctx.stroke();
                    ctx.fillStyle = fantasma;
                    ctx.beginPath(); ctx.arc(cx, gy + 5, 2, 0, 2*Math.PI); ctx.fill();
                    return;
                }

                // Sombra
                ctx.fillStyle = "#0a0719";
                ctx.beginPath(); ctx.ellipse(cx, gy + 2, 54 * esc, 5 * esc, 0, 0, 2 * Math.PI); ctx.fill();

                // Estelas de velocidad
                if (Math.abs(v) > 2) {
                    let largo = Math.min(80.0, Math.abs(v) * 1.7);
                    for (let j = 0; j < 3; j++) {
                        let yy = [-12, -20, -28][j];
                        let lj = largo * (0.55 + 0.45 * Math.sin(t * 28 + j * 2.1)) * (1 - 0.22 * j);
                        let [x1, y1] = T(-48, yy, false);
                        ctx.strokeStyle = mezclar(col, C.cielo1, 0.62); ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - d * lj * esc, y1); ctx.stroke();
                    }
                }

                // Faros
                let [fx, fy] = pf.faro;
                for (let [L, al] of [[112, 0.10], [80, 0.16], [50, 0.26]]) {
                    ctx.fillStyle = mezclar("#2a2058", "#fff1c4", al);
                    ctx.beginPath();
                    let [p1, p2, p3, p4] = [T(fx, fy - 1), T(fx + L, fy - 12), T(fx + L, fy + 14), T(fx, fy + 3)];
                    ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.lineTo(p4[0], p4[1]);
                    ctx.closePath(); ctx.fill();
                }

                // Carrocería
                let borde = mezclar(col, "#10082a", 0.55);
                ctx.fillStyle = col; ctx.strokeStyle = borde; ctx.lineWidth = 2;
                ctx.beginPath();
                pf.cuerpo.forEach((pt, idx) => {
                    let [X, Y] = T(pt[0], pt[1]);
                    if (idx === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
                });
                ctx.closePath(); ctx.fill(); ctx.stroke();

                // Vidrios y ruedas
                ctx.fillStyle = "#1b2547";
                ctx.beginPath();
                pf.vidrio.forEach((pt, idx) => {
                    let [X, Y] = T(pt[0], pt[1]);
                    if (idx === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
                });
                ctx.closePath(); ctx.fill();

                pf.ruedas.forEach(wx => {
                    let [Xc, Yc] = T(wx, -9.5, false);
                    let r = 9.5 * esc;
                    ctx.fillStyle = "#12092c"; ctx.beginPath(); ctx.arc(Xc, Yc, r * 1.22, 0, 2*Math.PI); ctx.fill();
                    ctx.fillStyle = "#0b0818"; ctx.beginPath(); ctx.arc(Xc, Yc, r, 0, 2*Math.PI); ctx.fill();
                    ctx.fillStyle = "#cfc8ee"; ctx.beginPath(); ctx.arc(Xc, Yc, r * 0.58, 0, 2*Math.PI); ctx.fill();
                });

                // Luz frontal y trasera
                let [hx, hy] = T(fx, fy);
                ctx.fillStyle = "#fff6cf"; ctx.beginPath(); ctx.arc(hx, hy, 3.4, 0, 2*Math.PI); ctx.fill();
                let [tx_, ty_] = T(pf.cola[0], pf.cola[1]);
                let frena = a * v < -0.01 && Math.abs(v) > 0.3;
                ctx.fillStyle = frena ? "#ff8a8f" : "#ff3b4a";
                ctx.beginPath(); ctx.arc(tx_, ty_, frena ? 6 : 3.4, 0, 2*Math.PI); ctx.fill();
            }

            dibujarChip(i, x, t) {
                let ctx = this.ctx, m = this.m;
                let col = i === 0 ? C.A : C.B;
                let [gy, esc] = LANE[i];
                let cxCar = this.sx(x);
                let y0 = CHIP_Y[i], w = 108, h = 36;
                let cx = Math.max(w / 2 + 6, Math.min(ANCHO - w / 2 - 6, cxCar));
                
                ctx.strokeStyle = mezclar(col, C.cielo2, 0.5); ctx.lineWidth = 1;
                ctx.setLineDash([2, 3]);
                ctx.beginPath(); ctx.moveTo(cx, y0 + h); ctx.lineTo(cxCar, gy - 46 * esc); ctx.stroke();
                ctx.setLineDash([]);

                rectRedondo(ctx, cx - w/2, y0, cx + w/2, y0 + h, 8, C.chip_bg, col, 1);
                ctx.fillStyle = col; ctx.font = "bold 10px 'JetBrains Mono'"; ctx.textAlign = "center";
                ctx.fillText(`${i === 0 ? 'A' : 'B'}   ${num(m.v(i, t))} m/s`, cx, y0 + 14);
                ctx.fillStyle = C.tenue; ctx.font = "8px 'JetBrains Mono'";
                ctx.fillText(`a = ${num(m.p(i)[2])} m/s²`, cx, y0 + 28);
            }

            dibujarEscena() {
                let ctx = this.ctx, m = this.m, t = m.t, now = performance.now() / 1000;

                // Estrellas y fondo
                // (Static stars simplified for performance)
                ctx.fillStyle = "#ffffff";
                for (let i = 0; i < 40; i++) {
                    let px = (i * 137) % ANCHO, py = (i * 41) % 120;
                    ctx.fillRect(px, py, 2, 2);
                }

                // Carretera rayas
                let per = pasoBonito(100.0 / this.cam_s, 1);
                ctx.strokeStyle = mezclar(C.raya, C.asfalto, 0.35); ctx.lineWidth = 3;
                let kMin = Math.floor(this.xw(0) / per) - 1, kMax = Math.ceil(this.xw(ANCHO) / per) + 2;
                for (let k = kMin; k <= kMax; k++) {
                    let px1 = this.sx(k * per), px2 = this.sx(k * per + per * 0.5);
                    ctx.beginPath(); ctx.moveTo(px1, 240); ctx.lineTo(px2, 240); ctx.stroke();
                }

                // Regla
                let [paso, tks] = marcas(this.xw(0), this.xw(ANCHO), 9);
                ctx.strokeStyle = C.tenue; ctx.lineWidth = 1;
                tks.forEach(xv => {
                    let px = this.sx(xv);
                    ctx.beginPath(); ctx.moveTo(px, RUTA_BOT); ctx.lineTo(px, RUTA_BOT + 8); ctx.stroke();
                    ctx.fillStyle = C.tenue; ctx.font = "9px Inter"; ctx.textAlign = "left";
                    ctx.fillText(`${g(xv)} m`, px + 3, RUTA_BOT + 18);
                });

                let revela = this.revela();
                let eventos = m.sol.eventos;

                if (revela) {
                    eventos.forEach((e, k) => {
                        let px = this.sx(e.x);
                        if (px < -150 || px > ANCHO + 150) return;
                        let pasado = t >= e.t;
                        ctx.strokeStyle = mezclar(C.ev, C.asfalto, pasado ? 0.15 : 0.5);
                        ctx.setLineDash([3, 4]);
                        ctx.beginPath(); ctx.moveTo(px, 50); ctx.lineTo(px, RUTA_BOT); ctx.stroke();
                        ctx.setLineDash([]);
                    });
                }

                // Vehículos (lejano primero)
                for (let i of [1, 0]) this.dibujarVehiculo(i, m.x(i), t);
                for (let i of [1, 0]) this.dibujarChip(i, m.x(i), t);

                // Reloj y distancia
                let gap = Math.abs(m.x(0) - m.x(1));
                ctx.fillStyle = C.texto; ctx.font = "bold 30px 'JetBrains Mono'"; ctx.textAlign = "right";
                ctx.fillText(t.toFixed(2), 150, 48);
                ctx.fillStyle = C.tenue; ctx.font = "12px Inter"; ctx.textAlign = "left";
                ctx.fillText("s", 154, 48);
                ctx.fillStyle = C.tenue; ctx.font = "11px 'JetBrains Mono'";
                ctx.fillText(`distancia ${gap.toFixed(1)} m`, 22, 70);
            }

            // ───────── Gráfica X-T ─────────
            gpx(t) { return GX0 + t / this.g.T * (GX1 - GX0); }
            gpy(x) { return GY1 - (x - this.g.lo) / (this.g.hi - this.g.lo) * (GY1 - GY0); }

            recalcularGrafica() {
                let m = this.m, T = m.T, n = 140;
                let ts = Array.from({length: n + 1}, (_, i) => T * i / n);
                let ys = [ts.map(t => pos(m.pa, t)), ts.map(t => pos(m.pb, t))];
                let lo = Math.min(...ys[0], ...ys[1]), hi = Math.max(...ys[0], ...ys[1]);
                if (hi - lo < 20) { let mid = (hi + lo) / 2; lo = mid - 10; hi = mid + 10; }
                let pad = (hi - lo) * 0.07;
                let [paso] = marcas(lo - pad, hi + pad, 6);
                lo = Math.floor((lo - pad) / paso) * paso;
                hi = Math.ceil((hi + pad) / paso) * paso;
                let [, tx] = marcas(lo, hi, 6);
                let [, tt] = marcas(0, T, 8);
                this.g = { T, lo, hi, tx, tt, ts, ys };
            }

            dibujarGrafica() {
                this.recalcularGrafica();
                let ctx = this.ctx, g_ = this.g, m = this.m;

                rectRedondo(ctx, GR[0], GR[1], GR[2], GR[3], 14, C.tarjeta, C.borde, 1);
                ctx.fillStyle = C.texto; ctx.font = "bold 11px Inter"; ctx.textAlign = "left";
                ctx.fillText("Posición contra tiempo", 28, 328);

                // Leyenda
                let lx = 214;
                for (let i of [0, 1]) {
                    let col = i === 0 ? C.A : C.B;
                    ctx.fillStyle = col; ctx.fillRect(lx, 324, 20, 3);
                    ctx.fillStyle = C.tenue; ctx.font = "10px Inter";
                    ctx.fillText(i === 0 ? "Vehículo A" : "Vehículo B", lx + 26, 328);
                    lx += 112;
                }

                // Mallas y ejes
                ctx.strokeStyle = C.malla; ctx.lineWidth = 1;
                g_.tt.forEach(tv => {
                    let px = this.gpx(tv);
                    ctx.beginPath(); ctx.moveTo(px, GY0); ctx.lineTo(px, GY1); ctx.stroke();
                    ctx.fillStyle = C.tenue; ctx.font = "9px Inter"; ctx.textAlign = "center";
                    ctx.fillText(g(tv), px, GY1 + 12);
                });
                g_.tx.forEach(xv => {
                    let py = this.gpy(xv);
                    ctx.beginPath(); ctx.moveTo(GX0, py); ctx.lineTo(GX1, py); ctx.stroke();
                    ctx.fillStyle = C.tenue; ctx.font = "9px Inter"; ctx.textAlign = "right";
                    ctx.fillText(g(xv), GX0 - 8, py + 3);
                });

                ctx.strokeStyle = C.eje; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(GX0, GY0 - 4); ctx.lineTo(GX0, GY1); ctx.lineTo(GX1 + 4, GY1); ctx.stroke();

                // Curvas completas
                for (let i of [0, 1]) {
                    let col = i === 0 ? C.A : C.B;
                    ctx.strokeStyle = mezclar(col, C.tarjeta, 0.6); ctx.lineWidth = 2;
                    ctx.beginPath();
                    g_.ts.forEach((t, idx) => {
                        let px = this.gpx(t), py = this.gpy(g_.ys[i][idx]);
                        if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    });
                    ctx.stroke();
                }

                // Curva recorrido actual + cursor
                let t = m.t;
                let pxCur = this.gpx(t);
                ctx.strokeStyle = C.texto; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
                ctx.beginPath(); ctx.moveTo(pxCur, GY0 - 6); ctx.lineTo(pxCur, GY1); ctx.stroke();
                ctx.setLineDash([]);

                for (let i of [0, 1]) {
                    let col = i === 0 ? C.A : C.B;
                    let yy = this.gpy(m.x(i));
                    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(pxCur, yy, 5, 0, 2*Math.PI); ctx.fill();
                    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
                }

                // Badge t actual
                rectRedondo(ctx, pxCur - 24, GY0 - 22, pxCur + 24, GY0 - 6, 7, C.texto, null);
                ctx.fillStyle = C.fondo; ctx.font = "bold 9px 'JetBrains Mono'"; ctx.textAlign = "center";
                ctx.fillText(`${t.toFixed(2)} s`, pxCur, GY0 - 11);
            }

            // ───────── Tarjeta de Solución ─────────
            dibujarSolucion() {
                let ctx = this.ctx, m = this.m, sol = m.sol;
                rectRedondo(ctx, SR[0], SR[1], SR[2], SR[3], 14, C.tarjeta, C.borde, 1);
                let xl = SR[0] + 16, xr = SR[2] - 16;

                ctx.fillStyle = C.texto; ctx.font = "bold 11px Inter"; ctx.textAlign = "left";
                ctx.fillText("Resolución paso a paso", xl, 328);

                let tono = C[sol.tono] || C.ok;
                rectRedondo(ctx, xl, 342, xr, 368, 10, mezclar(tono, C.tarjeta, 0.82), tono, 1);
                ctx.fillStyle = tono; ctx.font = "bold 11px Inter"; ctx.textAlign = "center";
                ctx.fillText(sol.titulo, (xl + xr) / 2, 357);

                ctx.fillStyle = C.tenue; ctx.font = "10px Inter"; ctx.textAlign = "left";
                ctx.fillText(sol.detalle, xl, 381);

                ctx.fillStyle = C.A; ctx.font = "10px 'JetBrains Mono'";
                ctx.fillText("xA = " + poli(m.pa), xl, 403);
                ctx.fillStyle = C.B;
                ctx.fillText("xB = " + poli(m.pb), xl, 419);

                ctx.fillStyle = C.tenue; ctx.font = "10px Inter";
                ctx.fillText("xA = xB  →  " + (Math.abs(sol.A) < EPS ? "B·t + C = 0 (A = 0)" : "A·t² + B·t + C = 0"), xl, 439);

                let filas = [
                    ["A = ½(aA − aB)", num(sol.A, 2)],
                    ["B = vA − vB", num(sol.B, 2)],
                    ["C = xA0 − xB0", num(sol.C, 1)],
                    ["D = B² − 4AC", sol.D !== null ? num(sol.D, 1) : "—"]
                ];
                let y = 459;
                filas.forEach(([et, val]) => {
                    ctx.fillStyle = C.tenue; ctx.font = "10px Inter"; ctx.textAlign = "left";
                    ctx.fillText(et, xl, y);
                    ctx.fillStyle = C.texto; ctx.font = "10px 'JetBrains Mono'"; ctx.textAlign = "right";
                    ctx.fillText(val, xr, y);
                    y += 18;
                });

                ctx.strokeStyle = C.borde; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(xl, 530); ctx.lineTo(xr, 530); ctx.stroke();

                let ev = sol.eventos;
                y = 552;
                if (ev.length) {
                    ev.forEach((e, k) => {
                        let suf = ev.length > 1 ? (k + 1) : "";
                        ctx.fillStyle = C.ev; ctx.font = "bold 13px 'JetBrains Mono'"; ctx.textAlign = "left";
                        ctx.fillText(`t${suf} = ${num(e.t, 2)} s`, xl, y);
                        ctx.textAlign = "right";
                        ctx.fillText(`x${suf} = ${num(e.x)} m`, xr, y);
                        y += 26;
                    });
                    ctx.fillStyle = C.ok; ctx.font = "10px Inter"; ctx.textAlign = "left";
                    ctx.fillText("✓ En ese instante xA y xB valen lo mismo", xl, 608);
                } else {
                    sol.notas.forEach(ln => {
                        ctx.fillStyle = C.texto; ctx.font = "10px Inter"; ctx.textAlign = "left";
                        ctx.fillText(ln, xl, y);
                        y += 16;
                    });
                }
            }
        }

        window.onload = () => { new AppWeb(); };
    </script>
</body>
</html>
