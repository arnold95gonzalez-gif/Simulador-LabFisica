<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reto de Persecuciones y Encuentros | MRU y MRUA</title>
<style>
:root{--a:#38bdf8;--b:#fb7185;--ok:#34d399;--bg:#090d16;--card:#111827;--bd:#334155;--tx:#e2e8f0;--mut:#94a3b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}
h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:13px}
header{--c:var(--ok)}
#pre{display:flex;flex-wrap:wrap;gap:6px}
button.on{background:var(--c);color:#000;font-weight:700}
#sc{margin-left:auto;font-weight:700;color:var(--ok)}
.wrap{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:310px 1fr;gap:16px}
section{min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.row input{flex:1;min-width:120px}
label{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mut);gap:6px}
input[type=number],select{background:#0f172a;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px;width:90px}
select{width:auto}
input[type=range]{width:100%}
input:disabled,button:disabled{opacity:.35}
button{background:#1e293b;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--a)}
canvas{display:block;width:100%;border-radius:8px;touch-action:none}
#cx,#cv{cursor:ew-resize}
#ban{border-left:4px solid var(--bd);font-size:15px;line-height:1.5}
#ban.ok{border-color:var(--ok)}
#ban.no{border-color:var(--b)}
#ban.flash{background:#065f46;border-color:var(--ok)}
#hud{font:12px monospace;color:var(--mut);margin-bottom:8px}
#dat p{margin:0 0 10px;line-height:1.6}
#fb div{margin-top:6px}
#fb small{display:block;color:var(--mut);margin-top:6px}
.tbl{overflow-x:auto;max-height:280px}
table{width:100%;border-collapse:collapse;font:12px monospace}
td,th{padding:4px 8px;border-bottom:1px solid var(--bd);text-align:right}
td:first-child,th:first-child{text-align:left}
tr.hit{background:#064e3b;color:#a7f3d0;font-weight:700}
.okc{color:var(--ok)}.noc{color:var(--b)}
@media(max-width:1000px){.wrap,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <!-- <a href="index.html">← Menú Principal</a> -->
  <h1>LabCinemática 1D · Reto de Encuentros</h1>
  <div><button id="mReto" class="on">🎲 Reto</button> <button id="mLibre">🎛️ Libre</button></div>
  <div id="pre" style="display:none"></div>
  <div id="sc"></div>
  <button id="bNew">🎲 Nuevo reto</button>
</header>

<main class="wrap">
  <aside>
    <div id="gameSide">
    <div class="card"><h3>📋 Datos del reto</h3><div id="dat"></div></div>
    <div class="card">
      <h3>✍️ Tus respuestas</h3>
      <div id="ans"></div>
      <div class="row"><button id="bChk">✔ Comprobar</button><button id="bGive">🏳 Rendirme</button></div>
      <div id="fb"></div>
    </div>
    </div>
    <div id="freeSide" style="display:none"></div>
  </aside>
  <section>
    <div id="ban" class="card"></div>
    <div class="card">
      <div id="hud"></div>
      <canvas id="track" data-h="270"></canvas>
      <div class="row">
        <button id="bPlay">▶ Iniciar</button>
        <button id="bReset">↺ Reiniciar</button>
        <button id="bEnc">🎯 Ir al encuentro</button>
        <input type="range" id="ts" min="0" max="20" step="0.01" value="0">
        <select id="cam"><option value="auto">Cámara: seguimiento</option><option value="fixed">Cámara: panorámica</option></select>
        <select id="spd"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
      </div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Posición x(t) <small>(arrastra sobre la gráfica)</small></h3><canvas id="cx" data-h="260"></canvas></div>
      <div class="card"><h3>Velocidad v(t) <small>(arrastra sobre la gráfica)</small></h3><canvas id="cv" data-h="260"></canvas></div>
    </div>
    <div class="card" id="rep"></div>
  </section>
</main>

<script>
// ---------- 1. ESTADO Y FÓRMULAS ----------
const $ = id => document.getElementById(id);
const AC = '#38bdf8', BC = '#fb7185', OK = '#34d399';
const PAD = { l: 48, r: 14, t: 14, b: 26 };
const S = { A: {}, B: {}, tmax: 20, t: 0, play: false };   // simulación
const G = { n: 0, pts: 0, streak: 0, free: false, tyF: { A: 'car', B: 'car' } };   // juego
let R, last = 0;

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[ri(0, a.length - 1)];
const n2 = x => +x.toFixed(2);
const sg = x => (x < 0 ? '− ' : '+ ') + Math.abs(n2(x));
const acc = v => v.mru ? 0 : v.a;
const pos = (v, t) => v.xi + v.vi * t + .5 * acc(v) * t * t;   // xf = xi + vi·t + ½·a·t²
const vel = (v, t) => v.vi + acc(v) * t;                       // vf = vi + a·t
const eqx = v => `${n2(v.xi)} ${sg(v.vi)}t${acc(v) ? ` ${sg(.5 * acc(v))}t²` : ''}`;
const eqv = v => `${n2(v.vi)}${acc(v) ? ` ${sg(acc(v))}t` : ''}`;

// Encuentro: xA(t) = xB(t)  →  ½(aA−aB)t² + (vA−vB)t + (xA−xB) = 0
function analyze() {
  const A = S.A, B = S.B, E = 1e-9;
  const q = .5 * (acc(A) - acc(B)), b = A.vi - B.vi, c = A.xi - B.xi;
  let all = [], d = null;
  if (Math.abs(q) > E) {
    d = b * b - 4 * q * c;
    if (d >= -E) { const s = Math.sqrt(Math.max(d, 0)); all = [(-b - s) / (2 * q), (-b + s) / (2 * q)]; }
  } else if (Math.abs(b) > E) all = [-c / b];
  all = [...new Set(all)].sort((x, y) => x - y);
  R = { q, b, c, d, all, r: all.filter(t => t > E), same: Math.abs(q) + Math.abs(b) + Math.abs(c) < E };
}

// ---------- 2. GENERADOR ALEATORIO DE RETOS ----------
// Se construye a partir de la solución (te entero), así el reto siempre tiene respuesta.
function gen() {
  for (;;) {
    const mode = pick(['v', 'a', 'pos', 'cl']), te = ri(3, 10);
    const A = { mru: 0, xi: pick([0, 0, ri(-40, 40)]), vi: ri(0, 20), a: pick([-2, -1, 1, 2, 3, 4, 5]) };
    const B = { mru: 1, xi: 0, vi: pick([-1, 1]) * ri(4, 20), a: 0 };
    if (mode === 'v' && Math.random() < .3) { A.mru = 1; A.a = 0; }
    if (mode !== 'pos' && Math.random() < .4) { B.mru = 0; B.a = pick([-2, -1, 1, 2]); }
    B.xi = pos(A, te) - B.vi * te - .5 * acc(B) * te * te;
    if (Math.abs(B.xi) > 400 || B.xi === A.xi || Math.abs(vel(A, te)) > 60 || Math.abs(vel(B, te)) > 60) continue;
    S.A = { ...A }; S.B = { ...B }; analyze();
    if (!R.r.length || Math.abs(R.r[0] - te) > 1e-6) continue;   // te debe ser el primer encuentro

    const xe = n2(pos(A, te));
    const hk = mode === 'v' ? 'vi' : mode === 'a' ? 'a' : mode === 'pos' ? (A.mru ? 'vi' : pick(['vi', 'a'])) : null;
    const T = { k: 't', l: 'Tiempo del encuentro (t)', u: 's', val: te };
    const X = { k: 'x', l: 'Posición del encuentro (x)', u: 'm', val: xe };
    const U = hk && { k: hk, l: hk === 'vi' ? 'Velocidad inicial de A (vᵢ)' : 'Aceleración de A (a)', u: hk === 'vi' ? 'm/s' : 'm/s²', val: A[hk] };
    const what = hk === 'vi' ? 'la velocidad inicial' : 'la aceleración';
    Object.assign(G, {
      mode, te, xe, hk, A0: { ...A }, B0: { ...B }, tmax: Math.ceil(te * 1.5) + 2,
      ty: { A: pick(['car', 'truck', 'moto']), B: pick(['car', 'truck', 'moto']) },
      ask: mode === 'cl' ? [T, X] : [U, mode === 'pos' ? T : X],
      txt: {
        v: `Los vehículos deben encontrarse exactamente en <b>t = ${te} s</b>. Calcula ${what} que necesita A y la posición del encuentro.`,
        a: `Los vehículos deben encontrarse exactamente en <b>t = ${te} s</b>. Calcula ${what} que necesita A y la posición del encuentro.`,
        pos: `Los vehículos deben encontrarse en <b>x = ${xe} m</b>. Calcula ${what} que necesita A y el tiempo del encuentro.`,
        cl: 'Con los datos dados, calcula el instante y la posición del <b>primer encuentro</b>.'
      }[mode],
      shown: false, rev: false, given: false, tries: 0
    });
    return;
  }
}

function newGame() {
  play(false); gen(); G.n++;
  S.t = 0; S.tmax = G.tmax;
  const row = (nm, v, col, h) => `<p style="color:${col}"><b>Vehículo ${nm}</b> · ${v.mru ? 'MRU' : 'MRUA'}<br>
    xᵢ = ${n2(v.xi)} m<br>vᵢ = ${h === 'vi' ? '❓' : n2(v.vi) + ' m/s'}<br>a = ${v.mru ? '0 (MRU)' : h === 'a' ? '❓' : n2(v.a) + ' m/s²'}</p>`;
  $('dat').innerHTML = row('A', G.A0, AC, G.hk) + row('B', G.B0, BC, null);
  $('ans').innerHTML = G.ask.map((q, i) => `<label>${q.l}<span><input type="number" step="any" id="in${i}"> ${q.u}</span></label>`).join('');
  $('fb').innerHTML = ''; $('bChk').disabled = $('bGive').disabled = false;
  score(); update();
}

const score = () => $('sc').textContent = `⭐ ${G.pts} pts · 🔥 racha ${G.streak}`;

function applyTruth(user) { // carga la simulación (con la respuesta del usuario o la verdadera)
  S.A = { ...G.A0 }; S.B = { ...G.B0 };
  if (user != null) S.A[G.hk] = user;
  S.t = 0; S.tmax = G.tmax; G.shown = true;
}

function check() {
  const u = G.ask.map((q, i) => parseFloat($('in' + i).value));
  if (u.some(isNaN)) { $('fb').innerHTML = '<div class="noc">Escribe todas las respuestas.</div>'; return; }
  G.tries++;
  const ok = G.ask.map((q, i) => Math.abs(u[i] - q.val) <= Math.max(.05, .02 * Math.abs(q.val)));
  const all = ok.every(Boolean);
  $('fb').innerHTML = G.ask.map((q, i) => `<div class="${ok[i] ? 'okc' : 'noc'}">${ok[i] ? '✓' : '✗'} ${q.l}</div>`).join('')
    + `<small>Intentos: ${G.tries} · tolerancia ±2 %</small>`
    + (G.tries > 2 && !all ? '<small>💡 Pista: plantea x<sub>A</sub>(t) = x<sub>B</sub>(t).</small>' : '');
  const i = G.ask.findIndex(q => q.k === G.hk);
  if (all) {
    applyTruth(); G.rev = true; G.streak++; G.pts += Math.max(2, 10 - 3 * (G.tries - 1));
    $('bChk').disabled = $('bGive').disabled = true; score();
  } else if (i >= 0) applyTruth(u[i]);   // simula con TU valor para que veas qué pasa
  else return;
  update(); play(true);
}

$('bChk').onclick = check;
$('bGive').onclick = () => {
  if (G.rev) return;
  G.given = G.rev = true; G.streak = 0; applyTruth(); score();
  $('bChk').disabled = $('bGive').disabled = true;
  $('fb').innerHTML = '<div class="noc">Respuestas: ' + G.ask.map(q => `${q.l} = ${n2(q.val)} ${q.u}`).join(' · ') + '</div>';
  update(); play(true);
};
$('bNew').onclick = newGame;

// ---------- 3. DIBUJO ----------
function ctxOf(cv) {
  const d = devicePixelRatio || 1, w = cv.getBoundingClientRect().width, h = +cv.dataset.h;
  cv.width = w * d; cv.height = h * d; cv.style.height = h + 'px';
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  return [c, w, h];
}

function veh(c, ty, pc, dir, wa, sp, a, ts) {
  c.save();
  if (dir < 0) c.scale(-1, 1);
  const rr = (x, y, w, h, r, f) => { c.fillStyle = f; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); };
  const dot = (x, y, r, f) => { c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); };
  if (Math.abs(sp) > 8) {
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { const o = (ts * 120 + i * 25) % 45, y = -26 + i * 9; c.beginPath(); c.moveTo(-36 - o, y); c.lineTo(-52 - o, y); c.stroke(); }
  }
  if (a * dir > .5) {
    c.fillStyle = 'rgba(251,146,60,.8)'; c.beginPath(); c.moveTo(-30, -11);
    c.lineTo(-52 * (.75 + Math.sin(ts * 45) * .25), -8); c.lineTo(-30, -5); c.fill();
  }
  c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.ellipse(0, 0, 34, 5, 0, 0, 7); c.fill();
  if (ty === 'truck') { rr(-34, -34, 44, 24, 4, pc); rr(11, -28, 21, 18, [2, 7, 3, 2], '#e2e8f0'); rr(21, -25, 9, 9, 2, '#0f172a'); }
  else if (ty === 'moto') { rr(-20, -14, 40, 7, 3, pc); dot(2, -24, 5, '#e2e8f0'); rr(-6, -20, 14, 7, 3, '#0f172a'); }
  else { rr(-32, -19, 64, 10, 4, pc); rr(-14, -28, 28, 10, [6, 6, 0, 0], pc); rr(-10, -26, 20, 7, 2, '#1e293b'); }
  const g = c.createLinearGradient(32, 0, 85, 0);
  g.addColorStop(0, 'rgba(254,240,138,.5)'); g.addColorStop(1, 'rgba(254,240,138,0)');
  c.fillStyle = g; c.beginPath(); c.moveTo(31, -15); c.lineTo(85, -24); c.lineTo(85, -3); c.lineTo(31, -11); c.fill();
  const wr = ty === 'moto' ? 7 : 6.5;
  (ty === 'truck' ? [-22, -6, 20] : [-19, 19]).forEach(x => {
    c.save(); c.translate(x, -wr); c.rotate(wa); dot(0, 0, wr, '#090d16');
    c.strokeStyle = '#94a3b8'; c.lineWidth = 1.5; c.stroke();
    c.beginPath(); c.moveTo(-wr + 2, 0); c.lineTo(wr - 2, 0); c.stroke(); c.restore();
  });
  c.restore();
}

function track(near, en) {
  const [c, w, h] = ctxOf($('track'));
  const T = S.tmax, t = S.t, hid = !G.shown;
  const xs = [pos(S.A, t), pos(S.B, t)];
  let lo, hi;
  if ($('cam').value === 'fixed' && !hid) {
    lo = 1e9; hi = -1e9;
    for (let i = 0; i <= 40; i++) for (const v of [S.A, S.B]) { const x = pos(v, T * i / 40); lo = Math.min(lo, x); hi = Math.max(hi, x); }
    const sp = Math.max(60, hi - lo); lo -= sp * .14; hi += sp * .14;
  } else {
    const a = Math.min(...xs), b = Math.max(...xs), sp = Math.max(70, (b - a) * 1.65), m = (a + b) / 2;
    lo = Math.min(a - 35, m - sp / 2); hi = Math.max(b + 35, m + sp / 2);
  }
  const sx = x => (x - lo) / (hi - lo) * w;
  const rt = h * .56, rb = h * .88, ly = (rt + rb) / 2;
  const grad = (y0, y1, st) => { const g = c.createLinearGradient(0, y0, 0, y1); st.forEach(([o, k]) => g.addColorStop(o, k)); return g; };

  c.fillStyle = grad(0, h * .65, [[0, '#050811'], [.6, '#0f172a'], [1, '#1e293b']]); c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.4)';
  for (let i = 0; i < 28; i++) c.fillRect(i * 97 % w, i * 43 % (h * .35), 1.5, 1.5);
  c.fillStyle = grad(rt, rb, [[0, '#1e293b'], [.5, '#0f172a'], [1, '#090d16']]); c.fillRect(0, rt, w, rb - rt);
  c.fillStyle = '#475569'; c.fillRect(0, rt - 3, w, 3);
  c.fillStyle = '#334155'; c.fillRect(0, rb, w, 4);

  const raw = (hi - lo) / 8, mg = 10 ** Math.floor(Math.log10(raw)), nn = raw / mg;
  const st = (nn < 1.5 ? 1 : nn < 3.5 ? 2 : nn < 7.5 ? 5 : 10) * mg;
  c.font = '600 11px monospace'; c.textAlign = 'center';
  for (let m = Math.floor(lo / st) * st; m <= hi + st; m += st) {
    const x = sx(m), z = Math.abs(m) < 1e-9;
    c.strokeStyle = 'rgba(248,250,252,.25)'; c.lineWidth = 2; c.setLineDash([14, 14]);
    c.beginPath(); c.moveTo(x, ly); c.lineTo(x + 28, ly); c.stroke(); c.setLineDash([]);
    c.strokeStyle = z ? AC : '#475569'; c.lineWidth = z ? 2 : 1;
    c.beginPath(); c.moveTo(x, rb); c.lineTo(x, rb + 7); c.stroke();
    c.fillStyle = z ? AC : '#94a3b8'; c.fillText(+m.toFixed(1) + ' m', x, rb + 20);
  }

  [[S.A.xi, 'xᵢA', AC], [S.B.xi, 'xᵢB', BC]].forEach(([x0, l, k]) => {
    const x = sx(x0); if (x < -20 || x > w + 20) return;
    c.strokeStyle = k; c.lineWidth = 1.5; c.setLineDash([4, 4]);
    c.beginPath(); c.moveTo(x, rt - 16); c.lineTo(x, rb); c.stroke(); c.setLineDash([]);
    c.fillStyle = k; c.font = '700 10px monospace'; c.fillText(`${l}=${n2(x0)}m`, x, rt - 20);
  });

  en.forEach(te => {   // punto de encuentro (solo cuando ya se resolvió)
    const xe = pos(S.A, te), x = sx(xe); if (x < -80 || x > w + 80) return;
    c.strokeStyle = OK; c.lineWidth = 2; c.setLineDash([5, 3]);
    c.beginPath(); c.moveTo(x, 66); c.lineTo(x, rb); c.stroke(); c.setLineDash([]);
    c.fillStyle = 'rgba(6,78,59,.92)'; c.beginPath(); c.roundRect(x - 75, 46, 150, 20, 6); c.fill(); c.stroke();
    c.fillStyle = '#6ee7b7'; c.font = '700 10px monospace'; c.fillText(`🎯 ENCUENTRO · ${xe.toFixed(1)} m`, x, 60);
    const d = Math.abs(t - te);
    if (d < .8) {
      c.strokeStyle = `rgba(52,211,153,${(1 - d / .8) * .7})`; c.lineWidth = 3;
      c.beginPath(); c.arc(x, ly, 15 + (1 - d / .8) * 45, 0, 7); c.stroke();
    }
  });

  [[S.A, '#0284c7', .36, 'A', '#e0f2fe'], [S.B, '#e11d48', .82, 'B', '#ffe4e6']].forEach(([v, pc, f, n, tc]) => {
    const x = pos(v, t), vv = hid ? 0 : vel(v, t), a = hid ? 0 : acc(v);
    const y = rt + (rb - rt) * f, X = sx(x);
    const dir = vv < -.05 ? -1 : vv > .05 ? 1 : a < 0 ? -1 : (n === 'B' && v.vi < 0) ? -1 : 1;
    c.save(); c.translate(X, y); veh(c, (G.free ? G.tyF : G.ty)[n], pc, dir, x * .25, vv, a, t); c.restore();
    const tx = hid ? `${n}: ${x.toFixed(1)}m | v = ?` : `${n}: ${x.toFixed(1)}m | ${vv.toFixed(1)}m/s`;
    c.font = '700 10px monospace';
    const tw = c.measureText(tx).width + 14;
    c.fillStyle = 'rgba(9,13,22,.88)'; c.strokeStyle = pc; c.lineWidth = 1.2;
    c.beginPath(); c.roundRect(X - tw / 2, y - 51, tw, 18, 5); c.fill(); c.stroke();
    c.fillStyle = tc; c.textAlign = 'center'; c.fillText(tx, X, y - 38);
  });

  if (near != null) {
    c.fillStyle = Math.floor(performance.now() / 200) % 2 ? '#065f46' : '#047857';
    c.fillRect(w / 2 - 120, 6, 240, 34);
    c.strokeStyle = OK; c.lineWidth = 2; c.strokeRect(w / 2 - 120, 6, 240, 34);
    c.fillStyle = '#ecfdf5'; c.font = 'bold 20px sans-serif'; c.textBaseline = 'middle';
    c.fillText('🎯 ¡ENCUENTRO!', w / 2, 24); c.textBaseline = 'alphabetic';
  }
}

function chart(id, f) {
  const [c, w, h] = ctxOf($(id));
  c.fillStyle = '#0b1220'; c.fillRect(0, 0, w, h);
  if (!G.shown) {
    c.fillStyle = '#94a3b8'; c.font = '12px sans-serif'; c.textAlign = 'center';
    c.fillText('Pulsa «Comprobar» para ver la gráfica', w / 2, h / 2); return;
  }
  const pw = w - PAD.l - PAD.r, ph = h - PAD.t - PAD.b, N = 100, T = S.tmax;
  const ys = [...Array(N + 1)].map((_, i) => [f(S.A, T * i / N), f(S.B, T * i / N)]);
  let lo = Math.min(...ys.flat()), hi = Math.max(...ys.flat());
  if (hi - lo < 1e-6) { lo -= 5; hi += 5; }
  const m = (hi - lo) * .1; lo -= m; hi += m;
  const px = t => PAD.l + t / T * pw, py = y => PAD.t + ph - (y - lo) / (hi - lo) * ph;

  c.font = '10px monospace'; c.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = lo + (hi - lo) * i / 5, t = T * i / 5;
    c.strokeStyle = '#243044'; c.beginPath();
    c.moveTo(PAD.l, py(y)); c.lineTo(w - PAD.r, py(y)); c.moveTo(px(t), PAD.t); c.lineTo(px(t), PAD.t + ph); c.stroke();
    c.fillStyle = '#94a3b8'; c.textAlign = 'right'; c.fillText(y.toFixed(1), PAD.l - 5, py(y) + 3);
    c.textAlign = 'center'; c.fillText(t.toFixed(1) + ' s', px(t), h - 8);
  }
  [AC, BC].forEach((col, k) => {
    c.strokeStyle = col; c.lineWidth = 2.5; c.beginPath();
    ys.forEach((p, i) => c[i ? 'lineTo' : 'moveTo'](px(T * i / N), py(p[k]))); c.stroke();
  });
  if (f === pos && G.rev) R.r.filter(t => t <= T).forEach(t => {
    const x = px(t), y = py(pos(S.A, t)), left = x > w - 90;
    c.fillStyle = OK; c.beginPath(); c.arc(x, y, 6, 0, 7); c.fill();
    c.textAlign = left ? 'right' : 'left'; c.font = 'bold 10px monospace';
    c.fillText('ENCUENTRO', left ? x - 9 : x + 9, y - 8);
  });
  c.strokeStyle = OK; c.lineWidth = 1.5; c.setLineDash([4, 4]);
  c.beginPath(); c.moveTo(px(S.t), PAD.t); c.lineTo(px(S.t), PAD.t + ph); c.stroke(); c.setLineDash([]);
  [[S.A, AC], [S.B, BC]].forEach(([v, col]) => {
    c.fillStyle = col; c.beginPath(); c.arc(px(S.t), py(f(v, S.t)), 5, 0, 7); c.fill();
  });

  // ecuación que describe cada gráfica
  const E = f === pos ? [`x_A(t) = ${eqx(S.A)}`, `x_B(t) = ${eqx(S.B)}`] : [`v_A(t) = ${eqv(S.A)}`, `v_B(t) = ${eqv(S.B)}`];
  c.font = 'bold 11px monospace';
  const bw = Math.max(...E.map(s => c.measureText(s).width)) + 12;
  c.fillStyle = 'rgba(11,18,32,.88)'; c.fillRect(PAD.l + 4, PAD.t + 2, bw, 38);
  c.textAlign = 'left';
  E.forEach((s, k) => { c.fillStyle = [AC, BC][k]; c.fillText(s, PAD.l + 10, PAD.t + 16 + k * 15); });
}

// ---------- 4. ARRASTRAR GRÁFICAS = MOVER EL TIEMPO ----------
['cx', 'cv'].forEach(id => {
  const c = $(id);
  const move = e => {
    if (!G.shown) return;
    const r = c.getBoundingClientRect(), pw = r.width - PAD.l - PAD.r;
    const t = Math.max(0, Math.min(S.tmax, (e.clientX - r.left - PAD.l) / pw * S.tmax));
    const hit = G.rev ? R.r.find(x => Math.abs(x - t) < S.tmax * .015) : null;
    S.t = hit ?? t; draw();
  };
  c.onpointerdown = e => { play(false); c.setPointerCapture(e.pointerId); c.drag = 1; move(e); };
  c.onpointermove = e => c.drag && move(e);
  c.onpointerup = () => c.drag = 0;
});
$('ts').oninput = e => { play(false); S.t = +e.target.value; draw(); };

// ---------- 5. PANTALLA, SOLUCIÓN Y ANIMACIÓN ----------
function draw() {
  const t = S.t, sh = G.shown;
  const en = G.rev ? R.r.filter(x => x <= S.tmax + 1e-9) : [];
  const near = en.find(x => Math.abs(x - t) < Math.max(.3, S.tmax * .02));
  $('ts').max = S.tmax; $('ts').value = t;
  $('ts').disabled = $('bPlay').disabled = $('bReset').disabled = !sh;
  $('bEnc').disabled = !G.rev;

  $('hud').innerHTML = sh
    ? `t = <b>${t.toFixed(2)} s</b> · Separación |Δx| = <b>${Math.abs(pos(S.A, t) - pos(S.B, t)).toFixed(2)} m</b> · Vel. relativa = <b>${Math.abs(vel(S.A, t) - vel(S.B, t)).toFixed(2)} m/s</b>`
    : 'Calcula tus respuestas aparte, escríbelas y pulsa «Comprobar» para ver la simulación.';

  const b = $('ban');
  b.className = 'card ' + (near != null ? 'flash' : G.free ? (R.r.length || R.same ? 'ok' : 'no') : G.rev ? 'ok' : sh ? 'no' : '');
  b.innerHTML = G.free ? freeMsg(near) : `<b>🎲 Reto #${G.n}</b> · ${G.txt}` + (near != null
    ? `<br>🎯 <b>¡ENCUENTRO!</b> t = ${n2(near)} s · x = ${n2(pos(S.A, near))} m`
    : G.rev ? (G.given ? '<br>🏳 Solución mostrada (0 puntos).' : '<br>✅ ¡Correcto!')
    : sh ? '<br>🧪 Simulación con TU respuesta: aún hay errores, revisa tus cálculos.' : '');

  track(near, en); chart('cx', pos); chart('cv', vel);
}

function report() {
  const r = $('rep'); r.style.display = G.rev ? 'block' : 'none';
  if (!G.rev) return;
  const A = S.A, B = S.B, f = n2;
  const ts = [...Array(11)].map((_, i) => S.tmax * i / 10).concat(R.r.filter(x => x <= S.tmax)).sort((x, y) => x - y);
  r.innerHTML = `
    <h3>Solución paso a paso</h3>
    <p style="color:${AC}">x<sub>A</sub>(t) = ${eqx(A)}</p>
    <p style="color:${BC}">x<sub>B</sub>(t) = ${eqx(B)}</p>
    <p>x<sub>A</sub> = x<sub>B</sub> → ½(a<sub>A</sub>−a<sub>B</sub>)t² + (v<sub>A</sub>−v<sub>B</sub>)t + (x<sub>A</sub>−x<sub>B</sub>) = 0 → A = ${f(R.q)}, B = ${f(R.b)}, C = ${f(R.c)}${R.d != null ? `, Δ = ${f(R.d)}` : ''}</p>
    ${R.all.map(t => `<p class="${t > 0 ? 'okc' : 'noc'}">t = ${t.toFixed(4)} s → ${t > 0 ? `x = ${f(pos(A, t))} m ✓ válida` : '✗ descartada (t ≤ 0)'}</p>`).join('') || '<p class="noc">Sin solución real: no hay encuentro.</p>'}
    ${G.free ? '' : `<p><b>Respuestas:</b> ${G.ask.map(q => `${q.l} = ${f(q.val)} ${q.u}`).join(' · ')}</p>`}
    <div class="tbl"><table>
      <tr><th>t (s)</th><th>x<sub>A</sub> (m)</th><th>v<sub>A</sub> (m/s)</th><th>x<sub>B</sub> (m)</th><th>v<sub>B</sub> (m/s)</th><th>|Δx| (m)</th></tr>
      ${ts.map(t => `<tr class="${R.r.includes(t) ? 'hit' : ''}"><td>${f(t)}${R.r.includes(t) ? ' 🎯' : ''}</td><td>${f(pos(A, t))}</td><td>${f(vel(A, t))}</td><td>${f(pos(B, t))}</td><td>${f(vel(B, t))}</td><td>${f(Math.abs(pos(A, t) - pos(B, t)))}</td></tr>`).join('')}
    </table></div>`;
}

const update = () => { analyze(); report(); draw(); };

function play(on) {
  S.play = on;
  $('bPlay').textContent = on ? '⏸ Pausar' : '▶ Iniciar';
  if (on) { if (S.t >= S.tmax) S.t = 0; last = performance.now(); requestAnimationFrame(loop); }
}
function loop(now) {
  if (!S.play) return;
  S.t = Math.min(S.tmax, S.t + (now - last) / 1000 * $('spd').value);
  last = now; draw();
  S.t >= S.tmax ? play(false) : requestAnimationFrame(loop);
}

$('bPlay').onclick = () => play(!S.play);
$('bReset').onclick = () => { play(false); S.t = 0; draw(); };
$('bEnc').onclick = () => {
  const t = R.r[0];
  if (!G.rev || t == null) return;
  play(false);
  if (G.free && t > S.tmax) { S.tmax = Math.ceil(t * 1.15); fsync(); }
  S.t = Math.min(t, S.tmax); update();
};
addEventListener('resize', draw);
$('cam').onchange = draw;

// ---------- 6. MODO LIBRE (juega con los datos) ----------
const obj = v => v ? S[v] : S;
const field = (v, k, l, min, max, s, u) =>
  `<label>${l} <span><input type="number" data-v="${v}" data-k="${k}" step="${s}"> ${u}</span></label>
   <input type="range" data-v="${v}" data-k="${k}" min="${min}" max="${max}" step="${s}">`;
const TYS = [['car', '🚗 Auto'], ['truck', '🚛 Camión'], ['moto', '🏍️ Moto']];
const fcard = (id, col) =>
  `<div class="card" style="--c:${col}">
    <h3 style="color:${col}">Vehículo ${id}
      <span>
        <button data-v="${id}" data-m="1">MRU</button>
        <button data-v="${id}" data-m="0">MRUA</button>
        <select data-v="${id}" data-k="ty">${TYS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
      </span>
    </h3>
    ${field(id, 'xi', 'Posición inicial xᵢ', -200, 500, 1, 'm')}
    ${field(id, 'vi', 'Velocidad inicial vᵢ', -50, 80, .5, 'm/s')}
    ${field(id, 'a', 'Aceleración a', -15, 15, .1, 'm/s²')}
  </div>`;
$('freeSide').innerHTML = fcard('A', AC) + fcard('B', BC) +
  `<div class="card"><h3>Horizonte</h3>${field('', 'tmax', 'Tiempo máximo', 5, 100, 1, 's')}</div>`;

const P = {
  pursuit: [{ mru: 0, xi: 0, vi: 0, a: 4 }, { mru: 1, xi: 72, vi: 18, a: 0 }, 20, ['car', 'car']],
  headon: [{ mru: 0, xi: 0, vi: 20, a: 1 }, { mru: 1, xi: 350, vi: -15, a: 0 }, 15, ['car', 'truck']],
  double: [{ mru: 0, xi: 0, vi: 28, a: -2 }, { mru: 1, xi: 40, vi: 12, a: 0 }, 18, ['moto', 'car']]
};
const PL = { pursuit: '🚓 Persecución', headon: '⚡ Encuentro frontal', double: '🔄 Doble encuentro' };
$('pre').innerHTML = Object.entries(PL).map(([k, t]) => `<button data-p="${k}">${t}</button>`).join('');
$('pre').onclick = e => { const p = e.target.dataset.p; if (p) preset(p); };

function preset(k) {
  const [a, b, t, ty] = P[k];
  play(false);
  S.A = { ...a }; S.B = { ...b }; S.tmax = t; S.t = 0;
  G.tyF = { A: ty[0], B: ty[1] };
  fsync(); update();
}

function fsync(skip) { // estado → inputs del modo libre
  document.querySelectorAll('#freeSide [data-k]').forEach(el => {
    const d = el.dataset, o = obj(d.v);
    if (el !== skip) el.value = d.k === 'ty' ? G.tyF[d.v] : o[d.k];
    if (d.k === 'a') el.disabled = !!o.mru;
  });
  document.querySelectorAll('#freeSide [data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === +S[b.dataset.v].mru));
}

$('freeSide').addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (!d.k) return;
  if (d.k === 'ty') { G.tyF[d.v] = el.value; draw(); return; }
  const val = parseFloat(el.value);
  if (val !== val) return;
  obj(d.v)[d.k] = d.k === 'tmax' ? Math.max(1, val) : val;
  S.t = Math.min(S.t, S.tmax);
  fsync(el); update();
});
$('freeSide').addEventListener('click', e => {
  const d = e.target.dataset;
  if (d.m != null) { S[d.v].mru = +d.m; fsync(); update(); }
});

function freeMsg(near) {
  return near != null ? `🎯 <b>¡ENCUENTRO!</b> t = ${n2(near)} s · x = ${n2(pos(S.A, near))} m`
    : R.same ? '🤝 Trayectorias idénticas'
    : R.r.length ? '🎯 ' + R.r.map((x, i) => `Encuentro ${i + 1}: t = ${x.toFixed(2)} s, x = ${n2(pos(S.A, x))} m${x > S.tmax ? ' (fuera de t_max)' : ''}`).join(' | ')
    : '🚫 Los vehículos nunca se encuentran (t > 0)';
}

// Cambio de modo: cada modo conserva su propio estado al volver
function setMode(free) {
  if (free === G.free) return;
  play(false);
  const snap = () => ({ A: { ...S.A }, B: { ...S.B }, t: S.t, tmax: S.tmax, sh: G.shown, rev: G.rev });
  const load = s => { S.A = { ...s.A }; S.B = { ...s.B }; S.t = s.t; S.tmax = s.tmax; G.shown = s.sh; G.rev = s.rev; };
  if (free) G.sv = snap(); else G.fr = snap();
  G.free = free;
  $('gameSide').style.display = free ? 'none' : '';
  $('freeSide').style.display = free ? '' : 'none';
  $('bNew').style.display = free ? 'none' : '';
  $('pre').style.display = free ? '' : 'none';
  $('mReto').classList.toggle('on', !free);
  $('mLibre').classList.toggle('on', free);
  if (free) {
    if (G.fr) { load(G.fr); fsync(); }
    else { G.shown = G.rev = true; preset('pursuit'); return; }
  } else load(G.sv);
  update();
}
$('mReto').onclick = () => setMode(false);
$('mLibre').onclick = () => setMode(true);

// ---------- 7. INICIO ----------
newGame();
</script>
</body>
